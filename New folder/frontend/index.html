<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Internship Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&family=Schibsted+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="dashboard">

  <div class="sky-decor"><div class="dots"></div></div>

  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>

    <div class="content">
      <header id="topbar"></header>

      <!-- Stat cards -->
      <section class="stat-grid" id="stat-grid">
        <div class="card hoverable stat-card rise" style="--d:1">
          <div class="stat-top">
            <div class="stat-icon" data-icon="users"></div>
            <span class="trend">▲ 12%</span>
          </div>
          <div class="stat-value" id="stat-total">0</div>
          <div class="stat-label">Total Users</div>
          <svg class="stat-wave" viewBox="0 0 200 34" preserveAspectRatio="none"><path d="M0 24 Q 25 10 50 20 T 100 18 T 150 22 T 200 12 V 34 H 0 Z" fill="#e0f2fe"/></svg>
        </div>

        <div class="card hoverable stat-card rise" style="--d:2">
          <div class="stat-top">
            <div class="stat-icon green" data-icon="activity"></div>
            <span class="trend">▲ 8%</span>
          </div>
          <div class="stat-value" id="stat-active">0</div>
          <div class="stat-label">Active Interns</div>
          <svg class="stat-wave" viewBox="0 0 200 34" preserveAspectRatio="none"><path d="M0 20 Q 30 26 60 16 T 120 20 T 200 10 V 34 H 0 Z" fill="#e3f8ef"/></svg>
        </div>

        <div class="card hoverable stat-card rise" style="--d:3">
          <div class="stat-top">
            <div class="stat-icon indigo" data-icon="roles"></div>
            <span class="trend">▲ 2</span>
          </div>
          <div class="stat-value" id="stat-roles">0</div>
          <div class="stat-label">Roles Defined</div>
          <svg class="stat-wave" viewBox="0 0 200 34" preserveAspectRatio="none"><path d="M0 22 Q 40 12 80 22 T 160 16 T 200 20 V 34 H 0 Z" fill="#eef0fe"/></svg>
        </div>

        <div class="card hoverable stat-card rise" style="--d:4">
          <div class="stat-top">
            <div class="stat-icon amber" data-icon="chart"></div>
            <span class="trend down">▼ 3%</span>
          </div>
          <div class="stat-value" id="stat-inactive">0</div>
          <div class="stat-label">Inactive Users</div>
          <svg class="stat-wave" viewBox="0 0 200 34" preserveAspectRatio="none"><path d="M0 16 Q 30 24 60 18 T 120 24 T 200 14 V 34 H 0 Z" fill="#fdf3e1"/></svg>
        </div>
      </section>

      <!-- Recent users + activity -->
      <section class="dash-grid">
        <div class="card rise" style="--d:5">
          <div class="card-head">
            <div>
              <h2>Recent Users</h2>
              <p>The latest members added to the academy</p>
            </div>
            <a href="users.html" class="btn btn-ghost">View all</a>
          </div>
          <div class="card-body table-wrap">
            <table>
              <thead>
                <tr><th>Name</th><th>Role</th><th>Department</th><th>Status</th><th>Joined</th></tr>
              </thead>
              <tbody id="recent-users-body"></tbody>
            </table>
          </div>
        </div>

        <div class="card rise" style="--d:6">
          <div class="card-head">
            <div>
              <h2>Activity</h2>
              <p>What happened recently</p>
            </div>
          </div>
          <div class="card-body">
            <div class="feed" id="activity-feed"></div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
